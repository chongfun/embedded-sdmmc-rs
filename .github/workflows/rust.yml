name: Rust

on: [push, pull_request]

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt -- --check

  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test MSRV, Calendula OS pinned Rust, and latest stable.
        rust: ["1.87", "1.100.0", "stable"]
        features: ['log', 'defmt-log', '""']
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - name: Build
      run: cargo build --no-default-features --features ${{matrix.features}} --verbose
      env:
        DEFMT_LOG: debug
    - name: Run Tests
      run: cargo test --no-default-features --features ${{matrix.features}} --verbose
